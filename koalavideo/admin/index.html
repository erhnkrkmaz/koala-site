<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koala Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="./admin.css">
  </head>
  <body>
    <div id="login-screen" class="login-screen">
      <form id="login-form" class="login-card">
        <div class="brand">Koala Tech AI</div>
        <h1>Admin</h1>
        <label>
          Email
          <input type="email" id="login-email" autocomplete="username" required>
        </label>
        <label>
          Password
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <button type="submit" id="login-button">Sign in</button>
        <p id="login-error" class="error-text" hidden></p>
      </form>
    </div>

    <div id="app-screen" class="app-screen" hidden>
      <aside class="sidebar">
        <div class="brand">Koala Admin</div>
        <nav class="side-nav" id="tabs">
          <button class="side-tab active" data-tab="pending">
            <span class="side-tab-label">Under Review</span>
            <span class="side-tab-count" id="count-pending">0</span>
          </button>
          <button class="side-tab" data-tab="safety">
            <span class="side-tab-label">Nude Hold</span>
            <span class="side-tab-count" id="count-safety">0</span>
          </button>
          <button class="side-tab" data-tab="reports">
            <span class="side-tab-label">Report Hold</span>
            <span class="side-tab-count" id="count-reports">0</span>
          </button>
          <button class="side-tab" data-tab="photos">
            <span class="side-tab-label">Profile Pic Update</span>
            <span class="side-tab-count" id="count-photos">0</span>
          </button>
        </nav>
        <button id="logout-button" class="ghost-button sidebar-signout">Sign out</button>
      </aside>

      <main class="panel">
        <div class="panel-toolbar">
          <h1 id="panel-title">Under Review</h1>
          <button id="refresh-button" class="ghost-button">Refresh</button>
        </div>
        <div id="panel-body" class="panel-body">
          <p class="empty-state">Loading…</p>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./admin.js"></script>
  </body>
</html>
